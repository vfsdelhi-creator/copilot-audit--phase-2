name: Code Scan and Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  scan-and-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run code scanner
      run: npm run scan
      continue-on-error: true
      
    - name: Generate audit report
      run: npm run audit
      continue-on-error: true
      
    - name: Upload audit reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: audit-reports
        path: audit-reports/
        retention-days: 30
        
    - name: Display summary
      if: always()
      run: |
        if [ -f audit-reports/audit-report.md ]; then
          echo "## Audit Report Summary" >> $GITHUB_STEP_SUMMARY
          cat audit-reports/audit-report.md >> $GITHUB_STEP_SUMMARY
        fi
